services:
  pg:
    image: postgres:18-bookworm
    env_file: ./db/.env
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  db:
    build: ./db
    env_file: ./db/.env
    ports:
      - "127.0.0.1:${STUDIO_PORT:-51212}:51212"
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - ./db/prisma:/app/prisma
      - ./db/lib:/app/lib
      - ./db/src:/app/src
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/starter-db-ready"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s
  api:
    build:
      context: .
      dockerfile: api/dockerfile
    env_file: ./api/.env
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api/src:/app/api/src
      - ./api/test:/app/api/test
      - ./db/lib:/app/db/lib
      - ./db/prisma/drizzle:/app/db/prisma/drizzle
  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:${METRO_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
